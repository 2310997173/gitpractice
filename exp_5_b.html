<!-- Create a simple web page with a button. Upon clicking the button,use Ajax to fetch data a public API
(e.g:JSONPlaceholder) and display it on the page. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Data With Ajax</title>
</head>
<body>
    <h1>Mithil, 7173</h1>
    <button id = "fetchButton">Fetch Data</button><br><br>
    <div id = "data">Click the button to fetch data.</div>
    <script>
        document.getElementById('fetchButton').addEventListener('click',function(){
            const xmlreq = new XMLHttpRequest();
            const url = 'https://jsonplaceholder.typicode.com/posts/1';
            document.getElementById('data').innerText = 'Loading....';
            xmlreq.open('GET', url , true);
            xmlreq.onload = function() {  
                if(xmlreq.status === 200) { // means url fetched successfully 
                    const response = JSON.parse(xmlreq.responseText);
                    document.getElementById('data').innerHTML = `
                    <h2>${response.title}</h2>
                    <p>${response.body}</p>
                    `;
                }else{
                    document.getElementById('data').textContent = 'Failed to fetch data.';
                }
            };
            xmlreq.onerrror = function() {
                document.getElementById('data').textContent = 'Error occured while fetching.';
            };
            xmlreq.send();
        });
    </script>
</body>
</html>
